name: CI and publish GHCR

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Notify validation started
        if: github.event_name == 'push'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: in_progress
          title: CI 검증 시작
          description: 의존성 설치와 품질 검증을 시작합니다.

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=cathedral
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: |
          pnpm run validate
          git diff --exit-code

      - name: Notify validation result
        if: always() && github.event_name == 'push'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: CI 검증 완료
          description: 품질 검증 단계가 종료되었습니다.

  publish:
    name: Build and publish images
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_digest: ${{ steps.build-app.outputs.digest }}
      migrator_digest: ${{ steps.build-migrator.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Notify image publishing started
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: in_progress
          title: GHCR 이미지 발행 시작
          description: 애플리케이션과 migrator 이미지를 빌드합니다.

      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        id: build-app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          build-args: |
            MINIO_PUBLIC_BASE_URL=https://api.gu3.kr
            NEXT_PUBLIC_SITE_URL=https://gu3.kr
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ steps.image.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            kr.gu3.cathedral.image-role=app
          cache-from: type=gha,scope=cathedral-app
          cache-to: type=gha,mode=max,scope=cathedral-app

      - name: Build and push migration image
        id: build-migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          platforms: linux/amd64
          push: true
          build-args: |
            MINIO_PUBLIC_BASE_URL=https://api.gu3.kr
            NEXT_PUBLIC_SITE_URL=https://gu3.kr
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}-migrator:latest
            ghcr.io/${{ steps.image.outputs.name }}-migrator:${{ steps.image.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            kr.gu3.cathedral.image-role=migrator
          cache-from: type=gha,scope=cathedral-app
          cache-to: type=gha,mode=max,scope=cathedral-migrator

      - name: Notify image publishing result
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: GHCR 이미지 발행 완료
          description: 애플리케이션과 migrator 이미지 발행 단계가 종료되었습니다.

  deploy:
    name: Deploy to Synology NAS
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Notify deployment request started
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: in_progress
          title: NAS 배포 요청 시작
          description: 서명된 배포 요청을 NAS webhook으로 전달합니다.

      - name: Request production deployment
        shell: bash
        env:
          APP_DIGEST: ${{ needs.publish.outputs.app_digest }}
          MIGRATOR_DIGEST: ${{ needs.publish.outputs.migrator_digest }}
          COMMIT_SHA: ${{ github.sha }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOY_WEBHOOK_SECRET" ]]; then
            echo "DEPLOY_WEBHOOK_SECRET is not configured"
            exit 1
          fi

          payload="$(
            jq --compact-output --null-input \
              --arg app_digest "$APP_DIGEST" \
              --arg migrator_digest "$MIGRATOR_DIGEST" \
              --arg sha "$COMMIT_SHA" \
              '{app_digest: $app_digest, migrator_digest: $migrator_digest, sha: $sha}'
          )"

          signature="$(
            printf '%s' "$payload" \
              | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" \
              | awk '{print $NF}'
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-all-errors \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "X-Signature: sha256=${signature}" \
            --data "$payload" \
            https://webhook.gu3.kr/hooks/cathedral-production

      - name: Notify deployment request result
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: NAS 배포 요청 전달 완료
          description: 이 결과는 요청 접수 여부이며 실제 배포 결과는 NAS 알림으로 전달됩니다.
